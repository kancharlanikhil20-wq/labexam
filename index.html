<!DOCTYPE html>
<html>
    <head>
        <title>College Event Dash board</title>
        <style>
            header{
                display: grid;
                    
                text-align:center;
                background-color: aqua;

                }
            .Box{
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1px;;
                padding: 20px;
                }
        </style>
    </head>
    <body>
        <header>
            <h2>College event dash board</h2>
        </header>
        <div class="header">
            <div class="Box">Upcoming events</div>
            <div class="Box">Event categories</div>
            <div class="Box">Event images</div>
            <div class="Box">Venue</div>
            <div class="Box">Date information</div>
            <div class="Box">Registration button</div>  
            <div class="Box">footer</div> 
        </div>
    </body>
</html>
